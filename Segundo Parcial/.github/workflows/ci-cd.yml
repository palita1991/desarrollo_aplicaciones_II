name: .NET MAUI CI/CD

# 1. ¿Cuándo se ejecuta? Al hacer push o pull request a la rama principal.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    # Ejecucion
    runs-on: windows-latest

    # Pipeline en múltiples versiones de .NET
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '10.0.x']

    steps:
    # Descarga de código
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Instalacion de herramientas
    - name: Install MAUI Workload
      run: dotnet workload install maui

    # Paquetes NuGet
    - name: Restore Dependencies
      run: dotnet restore MauiAppSegundoParcial.sln

    # Compilacion completa
    - name: Build Solution
      run: dotnet build MauiAppSegundoParcial.sln --no-restore --configuration Release

    # Ejecucion del proyecto
    - name: Run Unit Tests
      run: dotnet test MauiAppSegundoParcial.Tests/MauiAppSegundoParcial.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Resultados-Pruebas-NET-${{ matrix.dotnet-version }}
        path: '**/test-results.trx'