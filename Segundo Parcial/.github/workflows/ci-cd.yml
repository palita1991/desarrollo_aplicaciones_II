name: .NET MAUI CI/CD

# 1. ¿Cuándo se ejecuta? Al hacer push o pull request a la rama principal.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    # Ejecucion
    runs-on: windows-latest

    steps:
    # Descarga de código
    - name: Checkout Code
      uses: actions/checkout@v4

    # Entorno .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Coincide con el net10.0 de tu proyecto

    # Instalacion de herramientas
    - name: Install MAUI Workload
      run: dotnet workload install maui

    # Paquetes NuGet
    - name: Restore Dependencies
      run: dotnet restore MauiAppSegundoParcial.sln

    # Compilacion completa
    - name: Build Solution
      run: dotnet build MauiAppSegundoParcial.sln --no-restore --configuration Release

    # Ejecucion del proyecto
    - name: Run Unit Tests
      run: dotnet test MauiAppSegundoParcial.Tests/MauiAppSegundoParcial.Tests.csproj --no-build --configuration Release