name: .NET MAUI CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build_and_test:
    # Ejecucion
    runs-on: windows-latest

    # Pipeline en múltiples versiones de .NET
    defaults:
      run:
        working-directory: "Segundo Parcial"

    strategy:
      fail-fast: false
      matrix:
        configuration: [ "Debug", "Release" ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Pin .NET 10 SDK
      run: |
        Set-Content -Path global.json -Value '{"sdk":{"version":"10.0.100","rollForward":"latestMinor","allowPrerelease":false}}'
        dotnet --version
        
    - name: Cache NuGet Packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Segundo Parcial/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Instalacion de herramientas
    - name: Install MAUI Workload
      run: dotnet workload install maui

    # Paquetes NuGet
    - name: Restore Dependencies
      run: dotnet restore MauiAppSegundoParcial.Tests/MauiAppSegundoParcial.Tests.csproj -p:Configuration=${{ matrix.configuration }}

    # Compilacion completa
    - name: Build Test Project
      run: dotnet build MauiAppSegundoParcial.Tests/MauiAppSegundoParcial.Tests.csproj --no-restore --configuration ${{ matrix.configuration }}

    # Ejecucion del proyecto
    - name: Run Unit Tests
      run: dotnet test MauiAppSegundoParcial.Tests/MauiAppSegundoParcial.Tests.csproj --no-build --configuration ${{ matrix.configuration }} --results-directory ./TestResults --logger "trx;LogFileName=test-results.trx"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Resultados-Pruebas-${{ matrix.configuration }}
        path: Segundo Parcial/TestResults/test-results.trx